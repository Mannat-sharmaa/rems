<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Registration — REMS Real Estate</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-page {
      min-height: calc(100vh - 72px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      background: radial-gradient(circle at 50% 30%, rgba(37, 99, 235, 0.08) 0%, transparent 65%);
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 40px;
      max-width: 500px;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- Sticky Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="nav-logo">
        <div class="nav-logo-icon">🏢</div>
        <span>REMS</span>
      </a>

      <div class="nav-actions">
        <button id="theme-toggle-btn" class="btn-icon" title="Toggle Theme">🌙</button>
        <a href="/login.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 28px;">
        <div class="nav-logo-icon" style="margin: 0 auto 14px; width: 48px; height: 48px; font-size: 1.4rem;">👤</div>
        <h2 style="font-size: 1.7rem; font-weight: 800; letter-spacing: -0.5px;">Create Your Account</h2>
        <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 6px;">Register as a Customer to book properties and schedule visits</p>
      </div>

      <form id="form-register">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="reg-name" class="form-input" placeholder="e.g. Mannat Sharma" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" id="reg-email" class="form-input" placeholder="mannat@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="tel" id="reg-phone" class="form-input" placeholder="+91 98111 22001" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="reg-password" class="form-input" placeholder="Create a secure password" minlength="6" required>
        </div>

        <div class="form-group">
          <label class="form-label">Residential Address</label>
          <input type="text" id="reg-address" class="form-input" placeholder="e.g. Phase 7, Mohali, Punjab">
        </div>

        <div style="font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; margin: 12px 0;">
          By registering, you agree to our <a href="/terms.html" target="_blank" style="color: var(--primary); text-decoration: underline;">Terms of Service</a> and <a href="/privacy.html" target="_blank" style="color: var(--primary); text-decoration: underline;">Privacy Policy</a>.
        </div>

        <button type="submit" id="btn-register-submit" class="btn btn-primary" style="width: 100%; margin-top: 4px; padding: 13px;">
          Create Customer Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 20px; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="/login.html" style="color: var(--primary); font-weight: 700;">Sign in here</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
